<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | وسيط</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <a href="index.html"
       class="auth-logo">

        <span class="logo-icon">
            <i class="fas fa-scale-balanced"></i>
        </span>

        <span>
            <strong>وسيط</strong>
            <small>القانوني والقضائي</small>
        </span>

    </a>


    <div class="auth-card">

        <div class="auth-title">

            <i class="fas fa-right-to-bracket"></i>

            <h1>
                تسجيل الدخول
            </h1>

            <p>
                ادخل إلى حسابك
            </p>

        </div>


        <div id="loginMessage"></div>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="البريد الإلكتروني"
                    required>

            </div>


            <div class="form-group">

                <label>
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="كلمة المرور"
                    required>

            </div>


            <button
                type="submit"
                class="auth-submit">

                <i class="fas fa-right-to-bracket"></i>

                دخول

            </button>

        </form>


        <div class="auth-bottom">

            ليس لديك حساب؟

            <a href="register.html">
                إنشاء حساب جديد
            </a>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | وسيط</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <a href="index.html"
       class="auth-logo">

        <span class="logo-icon">
            <i class="fas fa-scale-balanced"></i>
        </span>

        <span>
            <strong>وسيط</strong>
            <small>القانوني والقضائي</small>
        </span>

    </a>


    <div class="auth-card">

        <div class="auth-title">

            <i class="fas fa-user-plus"></i>

            <h1>
                إنشاء حساب
            </h1>

            <p>
                أنشئ حسابك في منصة وسيط
            </p>

        </div>


        <div id="registerMessage"></div>


        <form id="registerForm">

            <div class="form-group">

                <label>
                    الاسم الكامل
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="الاسم الكامل"
                    required>

            </div>


            <div class="form-group">

                <label>
                    رقم الهاتف
                </label>

                <input
                    type="tel"
                    id="phone"
                    class="form-control"
                    placeholder="رقم الهاتف"
                    required>

            </div>


            <div class="form-group">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="example@email.com"
                    required>

            </div>


            <div class="form-group">

                <label>
                    نوع الحساب
                </label>

                <select
                    id="type"
                    class="form-control"
                    required>

                    <option value="">
                        اختر نوع الحساب
                    </option>

                    <option value="lawyer">
                        محامي
                    </option>

                    <option value="judge">
                        قاضٍ / محكم
                    </option>

                    <option value="trainee">
                        محامٍ تحت التدريب
                    </option>

                    <option value="client">
                        عميل
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="كلمة المرور"
                    minlength="6"
                    required>

            </div>


            <div class="form-group">

                <label>
                    تأكيد كلمة المرور
                </label>

                <input
                    type="password"
                    id="password2"
                    class="form-control"
                    placeholder="تأكيد كلمة المرور"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                class="auth-submit">

                <i class="fas fa-user-plus"></i>

                إنشاء الحساب

            </button>

        </form>


        <div class="auth-bottom">

            لديك حساب بالفعل؟

            <a href="login.html">
                تسجيل الدخول
            </a>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>

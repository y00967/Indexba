 messages:"wasit_messages_v7",

 notifications:"wasit_notifications_v7",
 current:"wasit_current_v7"
};

const Store={

 get(key){
  try{
   return JSON.parse(localStorage.getItem(key)) || [];
  }catch(e){return []}
 },

 set(key,value){
  localStorage.setItem(key,JSON.stringify(value));
 },

 current(){
  try{
   return JSON.parse(localStorage.getItem(DB.current)) || null;
  }catch(e){return null}
 },

 setCurrent(user){
  if(user) localStorage.setItem(DB.current,JSON.stringify(user));
  else localStorage.removeItem(DB.current);
 },

 updateUser(user){
  const users=this.get(DB.users);
  const i=users.findIndex(x=>x.id===user.id);
  if(i>=0){
   users[i]=user;
   this.set(DB.users,users);
   this.setCurrent(user);
  }
 }
};

/* =========================================================
   أدوات عامة
========================================================= */

function esc(value){
 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function currentUser(){
 return Store.current();
}

function getUser(id){
 return Store.get(DB.users).find(u=>u.id===id);
}

function isProfessional(user){
 return user &&
 (
  user.role.includes("محامي") ||
  user.role.includes("قاضي") ||
  user.role.includes("أمين سر")
 );
}

function avatar(user,size="w-12 h-12"){
 if(user.avatar){
  return `<img src="${user.avatar}"
  class="${size} rounded-full object-cover border-2 border-white shadow">`;
 }

 return `
 <div class="${size} rounded-full bg-primary text-white flex
 items-center justify-center font-bold shadow">
  ${esc(user.name.charAt(0))}
 </div>`;
}

function notify(message){
 alert(message);
}

function login(e){

 e.preventDefault();

 const email=document.getElementById("loginEmail").value.trim();
 const phone=document.getElementById("loginPhone").value.trim();
 const password=document.getElementById("loginPassword").value;

 const user=Store.get(DB.users).find(u=>
  u.email===email &&
  u.phone===phone &&
  u.password===password
 );

 if(!user){
  notify("بيانات الدخول غير صحيحة.");
  return;
 }

 Store.setCurrent(user);
 go("home");
}

function register(e){

 e.preventDefault();

 const user={
  id:Date.now(),
  name:document.getElementById("regName").value.trim(),
  email:document.getElementById("regEmail").value.trim(),
  phone:document.getElementById("regPhone").value.trim(),
  password:document.getElementById("regPassword").value,
  role:document.getElementById("regRole").value,
  location:document.getElementById("regLocation").value,
  bio:"مرحبًا بكم في صفحتي على منصة وسيط.",
  avatar:"",
  verified:false,
  professionalPage:isProfessional({
   role:document.getElementById("regRole").value
  }),
  created:new Date().toLocaleDateString("ar-YE")
 };

 const users=Store.get(DB.users);

 if(users.some(u=>u.email===user.email)){
  notify("البريد الإلكتروني مستخدم مسبقًا.");
  return;
 }

 users.push(user);
 Store.set(DB.users,users);
 Store.setCurrent(user);

 notify("تم إنشاء الحساب بنجاح.");
 go("home");
}

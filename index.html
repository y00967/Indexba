<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العدالة والمحاماة الرقمية الذكية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        secondary: '#b45309',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- الحاوية الرئيسية -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- تذييل الصفحة -->
    <footer class="bg-white border-t border-gray-200 text-center py-4 text-sm text-gray-500 mt-auto">
        منصة العدالة الرقمية الشاملة - نظام المحاماة والقضاء الذكي
    </footer>

    <!-- سكربت التطبيق البرمجي المتكامل -->
    <script>
        // Store & LocalStorage Management
        const Store = {
            getUsers: () => JSON.parse(localStorage.getItem('law_users_v2')) || [],
            setUsers: (users) => localStorage.setItem('law_users_v2', JSON.stringify(users)),
            getCurrentUser: () => JSON.parse(localStorage.getItem('law_currentUser_v2')) || null,
            setCurrentUser: (user) => localStorage.setItem('law_currentUser_v2', JSON.stringify(user)),
            getPosts: () => JSON.parse(localStorage.getItem('law_posts_v2')) || [],
            setPosts: (posts) => localStorage.setItem('law_posts_v2', JSON.stringify(posts)),
            getLibraryBooks: () => JSON.parse(localStorage.getItem('law_library_v2')) || [],
            setLibraryBooks: (books) => localStorage.setItem('law_library_v2', JSON.stringify(books)),
            getMinutes: () => JSON.parse(localStorage.getItem('law_minutes_v2')) || [],
            setMinutes: (mins) => localStorage.setItem('law_minutes_v2', JSON.stringify(mins)),
            getLawsuits: () => JSON.parse(localStorage.getItem('law_lawsuits_v2')) || [],
            setLawsuits: (suits) => localStorage.setItem('law_lawsuits_v2', JSON.stringify(suits)),
            getConsultations: () => JSON.parse(localStorage.getItem('law_consults_v2')) || [],
            setConsultations: (c) => localStorage.setItem('law_consults_v2', JSON.stringify(c)),
            getChats: () => JSON.parse(localStorage.getItem('law_chats_v2')) || [],
            setChats: (chats) => localStorage.setItem('law_chats_v2', JSON.stringify(chats)),
            getRequests: () => JSON.parse(localStorage.getItem('law_requests_v2')) || [],
            setRequests: (reqs) => localStorage.setItem('law_requests_v2', JSON.stringify(reqs)),
        };

        // تهيئة البيانات الافتراضية
        function initData() {
            if (Store.getUsers().length === 0) {
                Store.setUsers([
                    { id: 1, name: 'أحمد المحامي', email: 'ahmed@law.com', phone: '967771234567', pass: '123456', role: 'محامي ابتدائي', verified: true, subscriptionActive: true, bio: 'مختص بالقضايا التجارية والمدنية', location: 'صنعاء، اليمن', avatar: 'https://via.placeholder.com/150', socials: {email:'ahmed@law.com', phone:'967771234567', whatsapp:'967771234567', telegram:'ahmedlaw', x:'ahmed_law'} }
                ]);
            }
            if (Store.getLibraryBooks().length === 0) {
                Store.setLibraryBooks([
                    { id: 1, title: 'شرح قانون الإجراءات الجزائية', author: 'د. قاضي القضاة', category: 'قانون جنائي', fileName: 'شرح_الإجراءات.pdf', date: '2026/06/13', uploaderName: 'سارة القاضي' }
                ]);
            }
        }
        initData();

        function render() {
            const app = document.getElementById('app');
            const user = Store.getCurrentUser();

            if (!user) {
                app.innerHTML = renderAuthScreen();
            } else if (!user.subscriptionActive && (user.role.includes('محامي') || user.role.includes('قاض'))) {
                app.innerHTML = renderSubscriptionScreen(user);
            } else {
                app.innerHTML = renderMainLayout(user);
                initDropdownScript();
            }
        }

        // ================= المصادقة والتحقق والاشتراك =================
        let authMode = 'login';
        function renderAuthScreen() {
            return `
                <div class="flex flex-col items-center justify-center flex-grow p-4 bg-gray-50">
                    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
                        <div class="text-center mb-6">
                            <i class="fa-solid fa-scale-balanced text-4xl text-primary mb-2"></i>
                            <h1 class="text-2xl font-bold text-primary">منصة العدالة الرقمية الشاملة</h1>
                            <p class="text-sm text-gray-500">نظام القضاء، المحاماة، والاستشارات الذكية</p>
                        </div>
                        
                        <div class="flex border-b mb-6">
                            <button onclick="authMode='login'; render();" class="flex-1 pb-2 font-semibold text-center ${authMode==='login'?'border-b-2 border-primary text-primary':'text-gray-400'}">تسجيل الدخول</button>
                            <button onclick="authMode='register'; render();" class="flex-1 pb-2 font-semibold text-center ${authMode==='register'?'border-b-2 border-primary text-primary':'text-gray-400'}">إنشاء حساب جديد</button>
                        </div>

                        ${authMode === 'login' ? `
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">البريد الإلكتروني</label>
                                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">رقم الهاتف</label>
                                    <input type="text" id="loginPhone" required placeholder="مثال: 96777XXXXXXX" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                                    <input type="password" id="loginPass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-blue-900 transition">دخول آمن</button>
                            </form>
                        ` : `
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">الاسم الكامل</label>
                                    <input type="text" id="regName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">البريد الإلكتروني (لتفعيل المصادقة)</label>
                                    <input type="email" id="regEmail" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">رقم الهاتف</label>
                                    <input type="text" id="regPhone" required placeholder="96777XXXXXXX" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                                    <input type="password" id="regPass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">الصفة المهنية والتصنيف</label>
                                    <select id="regRole" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                        <optgroup label="المحامون">
                                            <option value="محامي تحت التمرين">محامي تحت التمرين</option>
                                            <option value="محامي ابتدائي">محامي ابتدائي</option>
                                            <option value="محامي استئنافي">محامي استئنافي</option>
                                            <option value="محامي محكمة عليا">محامي محكمة عليا</option>
                                        </optgroup>
                                        <optgroup label="القضاة">
                                            <option value="قاضي محكمة ابتدائية">قاضي محكمة ابتدائية</option>
                                            <option value="قاضي محكمة استئنافية">قاضي محكمة استئنافية</option>
                                            <option value="قاضي محكمة عليا">قاضي محكمة عليا</option>
                                        </optgroup>
                                        <optgroup label="أمناء السر">
                                            <option value="أمين سر محكمة ابتدائية">أمين سر محكمة ابتدائية</option>
                                            <option value="أمين سر محكمة استئنافية">أمين سر محكمة استئنافية</option>
                                            <option value="أمين سر محكمة عليا">أمين سر محكمة عليا</option>
                                        </optgroup>
                                        <option value="مستخدم عادي / عميل">مستخدم عادي / عميل</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">صورة شخصية للحساب</label>
                                    <input type="file" id="regAvatar" accept="image/*" class="w-full text-sm border rounded-lg p-2 bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">إرفاق إثبات الهوية / كارنيه النقابة أو القضاء (للتحقق بالذكاء الاصطناعي)</label>
                                    <input type="file" id="regIDCard" accept="image/*" class="w-full text-sm border rounded-lg p-2 bg-gray-50" required>
                                </div>
                                <button type="submit" class="w-full bg-secondary text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition">إنشاء الحساب وإرسال المصادقة</button>
                            </form>
                        `}
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const phone = document.getElementById('loginPhone').value;
            const pass = document.getElementById('loginPass').value;
            const users = Store.getUsers();
            const user = users.find(u => u.email === email && u.phone === phone && u.pass === pass);
            if (user) {
                Store.setCurrentUser(user);
                render();
            } else {
                alert('البيانات المدخلة غير صحيحة (تأكد من البريد ورقم الهاتف وكلمة المرور)');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            const fileInput = document.getElementById('regIDCard');
            const avatarInput = document.getElementById('regAvatar');

            if (fileInput.files.length === 0) {
                alert('يرجى إرفاق إثبات الهوية للتحقق.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const idCardImg = event.target.result;
                let isVerified = role.includes('مستخدم عادي') || confirm('يقوم الذكاء الاصطناعي الآن بقراءة وتحليل إثبات الهوية والتحقق من جهة الإصدار الرسمية...\nهل تم التحقق بنجاح؟ (اضغط موافق لمحاكاة القراءة الناجحة).');

                let avatarImg = 'https://via.placeholder.com/150';
                if (avatarInput.files && avatarInput.files[0]) {
                    const avatarReader = new FileReader();
                    avatarReader.onload = function(avEvent) {
                        saveNewUserFinal(name, email, phone, pass, role, isVerified, idCardImg, avEvent.target.result);
                    };
                    avatarReader.readAsDataURL(avatarInput.files[0]);
                } else {
                    saveNewUserFinal(name, email, phone, pass, role, isVerified, idCardImg, avatarImg);
                }
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function saveNewUserFinal(name, email, phone, pass, role, isVerified, idCardImg, avatarImg) {
            const users = Store.getUsers();
            if (users.some(u => u.email === email)) {
                alert('البريد الإلكتروني مستخدم مسبقاً.');
                return;
            }

            const newUser = {
                id: Date.now(),
                name, email, phone, pass, role,
                verified: isVerified,
                subscriptionActive: false,
                bio: 'مرحباً بك في صفحتي المهنية القانونية.',
                location: 'اليمن',
                avatar: avatarImg,
                idCard: idCardImg,
                socials: { email, phone, whatsapp: phone, telegram: '', x: '', instagram: '' }
            };

            users.push(newUser);
            Store.setUsers(users);
            Store.setCurrentUser(newUser);
            alert(`تم إنشاء الحساب بنجاح.`);
            render();
        }

        function renderSubscriptionScreen(user) {
            return `
                <div class="flex flex-col items-center justify-center flex-grow p-4 bg-gray-50">
                    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200 text-center space-y-4">
                        <i class="fa-solid fa-credit-card text-5xl text-secondary"></i>
                        <h2 class="text-2xl font-bold text-primary">تجديد الاشتراك الشهري للخدمة</h2>
                        <p class="text-sm text-gray-600">عزيزي ${user.name} (${user.role})، يتطلب النظام اشتراكاً شهرياً بقيمة <strong>2000</strong> لاستمرار تفعيل صلاحيات المنصة المهنية بالكامل.</p>
                        <button onclick="paySubscription()" class="w-full bg-secondary text-white py-3 rounded-lg font-bold hover:bg-amber-700 transition">دفع الاشتراكات وتفعيل الحساب</button>
                        <button onclick="logout()" class="text-red-500 text-sm hover:underline">تسجيل الخروج</button>
                    </div>
                </div>
            `;
        }

        function paySubscription() {
            const user = Store.getCurrentUser();
            user.subscriptionActive = true;
            Store.setCurrentUser(user);
            const users = Store.getUsers();
            const idx = users.findIndex(u => u.id === user.id);
            if(idx > -1) { users[idx] = user; Store.setUsers(users); }
            alert('تم سداد الاشتراك الشهري بنجاح وتفعيل كافة الصلاحيات!');
            render();
        }

        // ================= التخطيط والتنقل الرئيسي =================
        let currentTab = 'feed';
        let viewingUserId = null;

        function renderMainLayout(user) {
            const isLegalProfessional = user.role.includes('محامي') || user.role.includes('قاض');
            return `
                <header class="bg-primary text-white shadow sticky top-0 z-50">
                    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="flex items-center space-x-4 space-x-reverse">
                            <div class="flex items-center space-x-2 space-x-reverse cursor-pointer" onclick="currentTab='feed'; render();">
                                <i class="fa-solid fa-scale-balanced text-2xl text-secondary"></i>
                                <span class="font-bold text-lg hidden sm:inline">العدالة الرقمية</span>
                            </div>
                            <div class="relative">
                                <input type="text" id="headerSearch" oninput="quickSearch(this.value)" placeholder="بحث سريع في المنصة..." class="px-3 py-1 text-sm rounded-lg text-gray-800 bg-white focus:outline-none w-40 sm:w-60">
                                <div id="quickSearchResults" class="absolute right-0 mt-1 w-64 bg-white text-gray-800 shadow-lg rounded-lg hidden z-50 p-2 border max-h-60 overflow-y-auto"></div>
                            </div>
                        </div>

                        <div class="relative">
                            <button id="dropdownBtn" class="flex items-center space-x-2 space-x-reverse bg-blue-900 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-800 transition">
                                <img src="${user.avatar}" class="w-6 h-6 rounded-full object-cover">
                                <span>${user.name}</span>
                                <span class="text-xs bg-secondary px-2 py-0.5 rounded">${user.role}</span>
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </button>
                            <div id="userDropdownMenu" class="absolute left-0 mt-2 w-56 bg-white text-gray-800 rounded-lg shadow-xl border hidden z-50 py-2">
                                <a href="#" onclick="currentTab='profile'; viewingUserId=null; render(); closeDropdown();" class="block px-4 py-2 text-sm hover:bg-gray-100"><i class="fa-solid fa-user ml-2"></i> صفحتي الشخصية</a>
                                <a href="#" onclick="currentTab='library'; render(); closeDropdown();" class="block px-4 py-2 text-sm hover:bg-gray-100"><i class="fa-solid fa-book ml-2"></i> المكتبة القانونية</a>
                                <a href="#" onclick="currentTab='settings'; render(); closeDropdown();" class="block px-4 py-2 text-sm hover:bg-gray-100"><i class="fa-solid fa-gear ml-2"></i> إعدادات الحساب وتغيير الصورة</a>
                                <div class="border-t my-1"></div>
                                <a href="#" onclick="logout();" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket ml-2"></i> تسجيل الخروج</a>
                            </div>
                        </div>
                    </div>

                    <div class="bg-blue-950 text-xs sm:text-sm py-2 px-4">
                        <div class="max-w-6xl mx-auto flex flex-wrap gap-4 items-center justify-center">
                            <button onclick="currentTab='feed'; render();" class="${currentTab==='feed'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-house"></i> الرئيسية</button>
                            <button onclick="currentTab='search'; render();" class="${currentTab==='search'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-magnifying-glass"></i> دليل المحامين والقضاة</button>
                            <button onclick="currentTab='library'; render();" class="${currentTab==='library'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-book-open"></i> المكتبة القانونية</button>
                            <button onclick="currentTab='minutes'; render();" class="${currentTab==='minutes'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-file-pen"></i> المحاضر والتحقيقات</button>
                            <button onclick="currentTab='lawsuits'; render();" class="${currentTab==='lawsuits'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-gavel"></i> الدعاوى والدفوع</button>
                            ${isLegalProfessional ? `<button onclick="currentTab='consults'; render();" class="${currentTab==='consults'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-comments-dollar"></i> طلبات الدراسات والاستشارات</button>` : ''}
                            <button onclick="currentTab='chat'; render();" class="${currentTab==='chat'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-comments"></i> المراسلة</button>
                        </div>
                    </div>
                </header>

                <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
                    ${currentTab === 'feed' ? renderFeedTab(user) : ''}
                    ${currentTab === 'search' ? renderSearchTab(user) : ''}
                    ${currentTab === 'profile' ? renderProfileTab(user, viewingUserId || user.id) : ''}
                    ${currentTab === 'library' ? renderLibraryTab(user) : ''}
                    ${currentTab === 'minutes' ? renderMinutesTab(user) : ''}
                    ${currentTab === 'lawsuits' ? renderLawsuitsTab(user) : ''}
                    ${currentTab === 'consults' ? renderConsultsTab(user) : ''}
                    ${currentTab === 'chat' ? renderChatTab(user) : ''}
                    ${currentTab === 'settings' ? renderSettingsTab(user) : ''}
                </main>
            `;
        }

        function initDropdownScript() {
            const btn = document.getElementById('dropdownBtn');
            const menu = document.getElementById('userDropdownMenu');
            if(btn && menu) {
                btn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); };
                window.onclick = () => menu.classList.add('hidden');
            }
        }
        function closeDropdown() { const menu = document.getElementById('userDropdownMenu'); if(menu) menu.classList.add('hidden'); }
        function logout() { Store.setCurrentUser(null); render(); }

        function quickSearch(query) {
            const box = document.getElementById('quickSearchResults');
            if(!query.trim()) { box.classList.add('hidden'); return; }
            const users = Store.getUsers().filter(u => u.name.includes(query) || u.role.includes(query));
            let html = '';
            users.forEach(u => html += `<div onclick="viewUserProfile(${u.id}); document.getElementById('quickSearchResults').classList.add('hidden');" class="p-1 hover:bg-gray-100 cursor-pointer text-xs">👤 ${u.name} (${u.role})</div>`);
            if(html) { box.innerHTML = html; box.classList.remove('hidden'); } else { box.classList.add('hidden'); }
        }

        // ================= 1. الرئيسية والمنشورات =================
        function renderFeedTab(user) {
            const posts = Store.getPosts();
            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-4">
                        <div class="bg-white p-4 rounded-xl shadow border text-center space-y-2">
                            <img src="${user.avatar}" class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-primary">
                            <h3 class="font-bold text-lg">${user.name}</h3>
                            <span class="inline-block bg-secondary text-white text-xs px-2 py-1 rounded-full">${user.role}</span>
                            <p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot"></i> ${user.location || 'غير محدد'}</p>
                            <p class="text-sm text-gray-600">${user.bio}</p>
                        </div>
                    </div>

                    <div class="md:col-span-2 space-y-6">
                        ${(user.role.includes('محامي') || user.role.includes('قاض') || user.role.includes('أمين سر')) ? `
                            <div class="bg-white p-4 rounded-xl shadow border">
                                <form onsubmit="handleCreatePost(event)">
                                    <textarea id="postContent" rows="3" placeholder="شارك تعميماً قضائياً، قضية عامة، أو مقالاً قانونياً..." class="w-full p-2 border rounded-lg focus:outline-none focus:border-primary resize-none"></textarea>
                                    <div class="flex justify-between items-center mt-3">
                                        <input type="file" id="postImage" accept="image/*" class="text-xs">
                                        <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-900">نشر بالرئيسية</button>
                                    </div>
                                </form>
                            </div>
                        ` : ''}

                        <div class="space-y-4">
                            ${posts.length === 0 ? '<p class="text-center text-gray-400">لا توجد منشورات حتى الآن.</p>' : ''}
                            ${posts.slice().reverse().map(post => `
                                <div class="bg-white p-4 rounded-xl shadow border space-y-3">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="viewUserProfile(${post.userId})">
                                            <img src="${post.userAvatar}" class="w-10 h-10 rounded-full object-cover">
                                            <div>
                                                <h4 class="font-bold text-sm">${post.userName}</h4>
                                                <span class="text-xs text-gray-400">${post.userRole}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="text-gray-700 whitespace-pre-line">${post.content}</p>${post.image ? `<img src="${post.image}" class="rounded-lg max-h-80 w-full object-cover">` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleCreatePost(e) {
            e.preventDefault();
            const user = Store.getCurrentUser();
            const content = document.getElementById('postContent').value;
            const fileInput = document.getElementById('postImage');
            if(!content.trim()) return;

            if(fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = (ev) => savePostFinal(user, content, ev.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                savePostFinal(user, content, '');
            }
        }

        function savePostFinal(user, content, image) {
            const posts = Store.getPosts();
            posts.push({ id: Date.now(), userId: user.id, userName: user.name, userRole: user.role, userAvatar: user.avatar, content, image, likes: [] });
            Store.setPosts(posts);
            render();
        }

        // ================= 2. دليل المحامين والقضاة =================
        function renderSearchTab(user) {
            const users = Store.getUsers();
            return `
                <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow border space-y-6">
                    <h2 class="text-xl font-bold text-primary">دليل العدالة (المحامون، القضاة، أمناء السر)</h2>
                    <input type="text" id="searchInput" oninput="filterUsers(this.value)" placeholder="ابحث بالاسم أو التصنيف الدقيق..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary">
                    <div id="directoryResults" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${users.map(u => `
                            <div class="flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 shadow-sm">
                                <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="viewUserProfile(${u.id})">
                                    <img src="${u.avatar}" class="w-14 h-14 rounded-full object-cover border">
                                    <div>
                                        <h4 class="font-bold text-lg">${u.name}</h4>
                                        <span class="text-xs bg-secondary text-white px-2 py-0.5 rounded">${u.role}</span>
                                        <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-location-dot"></i> ${u.location || 'غير محدد'}</p>
                                    </div>
                                </div>
                                <button onclick="viewUserProfile(${u.id})" class="bg-primary text-white px-3 py-1.5 rounded-lg text-sm hover:bg-blue-900">الملف الشخصي</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        function filterUsers(query) {
            const users = Store.getUsers().filter(u => u.name.includes(query) || u.role.includes(query));
            // يمكن تحديث عرض النتائج هنا
        }

        // ================= 3. الصفحة الشخصية للمستخدم =================
        function viewUserProfile(userId) { viewingUserId = userId; currentTab = 'profile'; render(); }

        function renderProfileTab(currentUser, profileUserId) {
            const users = Store.getUsers();
            const profileUser = users.find(u => u.id === profileUserId) || currentUser;
            const isOwner = currentUser.id === profileUser.id;

            return `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow border text-center relative space-y-3">
                        <div class="relative inline-block">
                            <img src="${profileUser.avatar}" class="w-28 h-28 rounded-full mx-auto object-cover border-4 border-primary shadow">
                            ${isOwner ? `
                                <label for="changeAvatarInput" class="absolute bottom-0 left-0 bg-secondary text-white p-2 rounded-full cursor-pointer shadow hover:bg-amber-700" title="تغيير الصورة الشخصية">
                                    <i class="fa-solid fa-camera text-xs"></i>
                                </label>
                                <input type="file" id="changeAvatarInput" accept="image/*" class="hidden" onchange="updateProfileAvatar(this)">
                            ` : ''}
                        </div>
                        <h2 class="text-2xl font-bold">${profileUser.name}</h2>
                        <span class="inline-block bg-secondary text-white text-sm px-3 py-1 rounded-full">${profileUser.role}</span>
                        <p class="text-sm text-gray-500"><i class="fa-solid fa-location-dot"></i> الموقع: <strong>${profileUser.location || 'غير محدد'}</strong></p>
                        <p class="text-gray-600 max-w-lg mx-auto">${profileUser.bio}</p>

                        ${isOwner ? `
                            <div class="mt-4">
                                <button onclick="openEditProfile()" class="bg-primary text-white px-4 py-1.5 rounded-lg text-sm hover:bg-blue-900"><i class="fa-solid fa-pen"></i> تعديل النبذة والموقع ووسائل التواصل</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function updateProfileAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newAvatarUrl = e.target.result;
                    const currentUser = Store.getCurrentUser();
                    
                    // تحديث المستخدم الحالي
                    currentUser.avatar = newAvatarUrl;
                    Store.setCurrentUser(currentUser);

                    // تحديث في قائمة المستخدمين العامين
                    const users = Store.getUsers();
                    const idx = users.findIndex(u => u.id === currentUser.id);
                    if (idx > -1) {
                        users[idx].avatar = newAvatarUrl;
                        Store.setUsers(users);
                    }

                    alert('تم تغيير وتحديث الصورة الشخصية بنجاح!');
                    render();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openEditProfile() {
            const user = Store.getCurrentUser();
            const newBio = prompt('تعديل النبذة التعريفية:', user.bio);
            const newLocation = prompt('تحديد مكان التواجد:', user.location || '');
            if(newBio !== null) user.bio = newBio;
            if(newLocation !== null) user.location = newLocation;

            Store.setCurrentUser(user);
            const users = Store.getUsers();
            const idx = users.findIndex(u => u.id === user.id);
            if(idx > -1) { users[idx] = user; Store.setUsers(users); }
            render();
        }

        // ================= الأقسام الأخرى الأساسية (المكتبة، المحاضر، الدعاوى، الاستشارات، المراسلة، الإعدادات) =================
        function renderLibraryTab(user) { return `<div class="bg-white p-6 rounded-xl shadow border"><h2 class="text-xl font-bold text-primary">المكتبة القانونية العامة</h2></div>`; }
        function renderMinutesTab(user) { return `<div class="bg-white p-6 rounded-xl shadow border"><h2 class="text-xl font-bold text-primary">المحاضر والتحقيقات السرية</h2></div>`; }
        function renderLawsuitsTab(user) { return `<div class="bg-white p-6 rounded-xl shadow border"><h2 class="text-xl font-bold text-primary">صياغة الدعاوى والمذكرات</h2></div>`; }
        function renderConsultsTab(user) { return `<div class="bg-white p-6 rounded-xl shadow border"><h2 class="text-xl font-bold text-primary">طلبات الاستشارات</h2></div>`; }
        function renderChatTab(user) { return `<div class="bg-white p-6 rounded-xl shadow border"><h2 class="text-xl font-bold text-primary">المراسلة الفورية</h2></div>`; }
        
        function renderSettingsTab(user) {
            return `
                <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow border space-y-4">
                    <h2 class="text-xl font-bold text-primary">إعدادات الحساب وتغيير الصورة الشخصية</h2>
                    <div class="flex items-center space-x-4 space-x-reverse">
                        <img src="${user.avatar}" class="w-16 h-16 rounded-full object-cover border">
                        <div>
                            <label for="settingsAvatar" class="bg-secondary text-white px-3 py-1.5 rounded-lg text-sm cursor-pointer hover:bg-amber-700 inline-block">اختر صورة جديدة للحساب</label>
                            <input type="file" id="settingsAvatar" accept="image/*" class="hidden" onchange="updateProfileAvatar(this)">
                        </div>
                    </div>
                    <p class="text-sm text-gray-600"><strong>الاسم:</strong> ${user.name}</p>
                    <p class="text-sm text-gray-600"><strong>البريد الإلكتروني:</strong> ${user.email}</p>
                    <button onclick="logout()" class="w-full bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700">تسجيل الخروج</button>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>

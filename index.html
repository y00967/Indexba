<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العدالة والمحاماة الرقمية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        secondary: '#b45309',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- الحاوية الرئيسية -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- تذييل الصفحة -->
    <footer class="bg-white border-t border-gray-200 text-center py-4 text-sm text-gray-500 mt-auto">
        منصة العدالة الرقمية الشاملة - نسخة تجريبية محلية (Local Storage)
    </footer>

    <!-- سكود التطبيق البرمجي المتكامل -->
    <script>
        // إدارة الحالة العامة والتخزين المحلي
        const Store = {
            getUsers: () => JSON.parse(localStorage.getItem('law_users')) || [],
            setUsers: (users) => localStorage.setItem('law_users', JSON.stringify(users)),
            getCurrentUser: () => JSON.parse(localStorage.getItem('law_currentUser')) || null,
            setCurrentUser: (user) => localStorage.setItem('law_currentUser', JSON.stringify(user)),
            getPosts: () => JSON.parse(localStorage.getItem('law_posts')) || [],
            setPosts: (posts) => localStorage.setItem('law_posts', JSON.stringify(posts)),
            getRequests: () => JSON.parse(localStorage.getItem('law_requests')) || [],
            setRequests: (reqs) => localStorage.setItem('law_requests', JSON.stringify(reqs)),
            getChats: () => JSON.parse(localStorage.getItem('law_chats')) || [],
            setChats: (chats) => localStorage.setItem('law_chats', JSON.stringify(chats)),
            getMinutes: () => JSON.parse(localStorage.getItem('law_minutes')) || [],
            setMinutes: (mins) => localStorage.setItem('law_minutes', JSON.stringify(mins)),
            getLawsuits: () => JSON.parse(localStorage.getItem('law_lawsuits')) || [],
            setLawsuits: (suits) => localStorage.setItem('law_lawsuits', JSON.stringify(suits)),
        };

        // تهيئة البيانات التجريبية إذا لم تكن موجودة
        function initData() {
            if (Store.getUsers().length === 0) {
                const defaultUsers = [
                    { id: 1, name: 'أحمد المحامي', email: 'ahmed@law.com', pass: '123456', role: 'محامي', bio: 'محامي مختص بالدعاوى المدنية والتجارية', avatar: 'https://via.placeholder.com/150', friends: [2] },
                    { id: 2, name: 'سارة القاضي', email: 'sara@court.com', pass: '123456', role: 'قاضٍ', bio: 'قاضي تحقيق وباحث قانوني', avatar: 'https://via.placeholder.com/150', friends: [1] }
                ];
                Store.setUsers(defaultUsers);
            }
            if (Store.getPosts().length === 0) {
                const defaultPosts = [
                    { id: 1, userId: 1, userName: 'أحمد المحامي', userRole: 'محامي', userAvatar: 'https://via.placeholder.com/150', content: 'مرحباً بالجميع في منصة العدالة الرقمية. تم تفعيل نظام النقاش القانوني ونشر الأبحاث.', image: '', likes: [2], comments: [{userId: 2, userName: 'سارة القاضي', text: 'أهلاً بك أستاذ أحمد، خطوة مباركة.'}] }
                ];
                Store.setPosts(defaultPosts);
            }
        }
        initData();

        // التوجيه والعرض بناءً على حالة تسجيل الدخول
        function render() {
            const app = document.getElementById('app');
            const user = Store.getCurrentUser();

            if (!user) {
                app.innerHTML = renderAuthScreen();
            } else {
                app.innerHTML = renderMainLayout(user);
                initMainScripts(user);
            }
        }

        // ================= شاشة المصادقة (تسجيل الدخول / إنشاء حساب) =================
        let authMode = 'login'; 
        function renderAuthScreen() {
            return `
                <div class="flex flex-col items-center justify-center flex-grow p-4">
                    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
                        <div class="text-center mb-6">
                            <i class="fa-solid fa-scale-balanced text-4xl text-primary mb-2"></i>
                            <h1 class="text-2xl font-bold text-primary">منصة العدالة الرقمية</h1>
                            <p class="text-sm text-gray-500">نظام إدارة المحاماة، القضاء، والتواصل القانوني</p>
                        </div>
                        
                        <div class="flex border-b mb-6">
                            <button onclick="authMode='login'; render();" class="flex-1 pb-2 font-semibold text-center ${authMode==='login'?'border-b-2 border-primary text-primary':'text-gray-400'}">تسجيل الدخول</button>
                            <button onclick="authMode='register'; render();" class="flex-1 pb-2 font-semibold text-center ${authMode==='register'?'border-b-2 border-primary text-primary':'text-gray-400'}">إنشاء حساب جديد</button>
                        </div>

                        ${authMode === 'login' ? `
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">البريد الإلكتروني</label>
                                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                                    <input type="password" id="loginPass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-blue-900 transition">دخول</button>
                            </form>
                        ` : `
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">الاسم الكامل</label>
                                    <input type="text" id="regName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">البريد الإلكتروني</label>
                                    <input type="email" id="regEmail" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                                    <input type="password" id="regPass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">الصفة المهنية</label>
                                    <select id="regRole" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                        <option value="محامي">محامي</option>
                                        <option value="قاضٍ">قاضٍ</option>
                                        <option value="متدرب قانوني">متدرب قانوني</option>
                                        <option value="باحث قانوني">باحث قانوني</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full bg-secondary text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition">تسجيل الحساب</button>
                            </form>
                        `}
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const users = Store.getUsers();
            const user = users.find(u => u.email === email && u.pass === pass);
            if (user) {
                Store.setCurrentUser(user);
                render();
            } else {
                alert('البريد الإلكتروني أو كلمة المرور غير صحيحة');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            const users = Store.getUsers();
            
            if (users.some(u => u.email === email)) {
                alert('البريد الإلكتروني مستخدم مسبقاً');
                return;
            }

            const newUser = {
                id: Date.now(),
                name, email, pass, role,
                bio: 'مستخدم جديد في المنصة',
                avatar: 'https://via.placeholder.com/150',
                friends: []
            };
            users.push(newUser);
            Store.setUsers(users);
            Store.setCurrentUser(newUser);
            render();
        }

        // ================= التخطيط الرئيسي والتنقل الداخلي =================
        let currentTab = 'feed'; // feed, search, profile, minutes, lawsuits, chat
        let viewingUserId = null;

        function renderMainLayout(user) {
            return `
                <!-- شريط التنقل العلوي -->
                <header class="bg-primary text-white shadow sticky top-0 z-50">
                    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="currentTab='feed'; render();">
                            <i class="fa-solid fa-scale-balanced text-2xl text-secondary"></i>
                            <span class="font-bold text-lg">العدالة الرقمية</span>
                        </div>
                        <div class="flex items-center space-x-3 space-x-reverse text-sm">
                            <button onclick="currentTab='feed'; render();" class="${currentTab==='feed'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-house"></i> الرئيسية</button>
                            <button onclick="currentTab='search'; render();" class="${currentTab==='search'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-magnifying-glass"></i> بحث</button>
                            <button onclick="currentTab='minutes'; render();" class="${currentTab==='minutes'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-file-pen"></i> المحاضر</button>
                            <button onclick="currentTab='lawsuits'; render();" class="${currentTab==='lawsuits'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-gavel"></i> الدعاوى والدفوع</button>
                            <button onclick="currentTab='chat'; render();" class="${currentTab==='chat'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-comments"></i> الرسائل</button>
                            <button onclick="currentTab='profile'; viewingUserId=null; render();" class="${currentTab==='profile'?'text-secondary font-bold':''} hover:text-secondary"><i class="fa-solid fa-user"></i> حسابي</button>
                            <button onclick="logout()" class="text-red-300 hover:text-red-100"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
                        </div>
                    </div>
                </header>

                <!-- جسم الصفحة والمحتوى حسب التبويب -->
                <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
                    ${currentTab === 'feed' ? renderFeedTab(user) : ''}
                    ${currentTab === 'search' ? renderSearchTab(user) : ''}
                    ${currentTab === 'profile' ? renderProfileTab(user, viewingUserId || user.id) : ''}
                    ${currentTab === 'minutes' ? renderMinutesTab(user) : ''}
                    ${currentTab === 'lawsuits' ? renderLawsuitsTab(user) : ''}
                    ${currentTab === 'chat' ? renderChatTab(user) : ''}
                </main>
            `;
        }

        function logout() {
            Store.setCurrentUser(null);
            render();
        }

        // ================= 1. الرئيسية (Feed) =================
        function renderFeedTab(user) {
            const posts = Store.getPosts();
            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-4">
                        <div class="bg-white p-4 rounded-xl shadow border text-center">
                            <img src="${user.avatar}" class="w-20 h-20 rounded-full mx-auto mb-3 object-cover border-2 border-primary">
                            <h3 class="font-bold text-lg">${user.name}</h3>
                            <span class="inline-block bg-secondary text-white text-xs px-2 py-1 rounded-full mb-2">${user.role}</span>
                            <p class="text-sm text-gray-500">${user.bio}</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow border">
                            <h4 class="font-bold text-sm mb-2 text-primary border-b pb-1">طلبات الصداقة المعلقة</h4>
                            <div id="friendRequestsList"></div>
                        </div>
                    </div>

                    <div class="md:col-span-2 space-y-6">
                        <div class="bg-white p-4 rounded-xl shadow border">
                            <form onsubmit="handleCreatePost(event)">
                                <textarea id="postContent" rows="3" placeholder="اكتب منشوراً قانونياً، استشارة، أو شارك بحثاً..." class="w-full p-2 border rounded-lg focus:outline-none focus:border-primary resize-none"></textarea>
                                <div class="flex justify-between items-center mt-3">
                                    <div class="flex items-center space-x-2 space-x-reverse">
                                        <label class="cursor-pointer text-gray-500 hover:text-primary">
                                            <i class="fa-solid fa-image text-xl"></i>
                                            <input type="file" id="postImage" accept="image/*" class="hidden" onchange="previewPostImage(this)">
                                        </label>
                                        <span id="imageFileName" class="text-xs text-gray-400"></span>
                                    </div>
                                    <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-900 transition">نشر</button>
                                </div>
                                <div id="postImagePreviewContainer" class="mt-2 hidden">
                                    <img id="postImagePreview" class="max-h-40 rounded-lg">
                                </div>
                            </form>
                        </div>

                        <div class="space-y-4" id="postsContainer">
                            ${posts.length === 0 ? '<p class="text-center text-gray-400">لا توجد منشورات حتى الآن.</p>' : ''}
                            ${posts.slice().reverse().map(post => `
                                <div class="bg-white p-4 rounded-xl shadow border space-y-3">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="viewUserProfile(${post.userId})">
                                            <img src="${post.userAvatar}" class="w-10 h-10 rounded-full object-cover">
                                            <div>
                                                <h4 class="font-bold text-sm">${post.userName}</h4>
                                                <span class="text-xs text-gray-400">${post.userRole}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="text-gray-700 whitespace-pre-line">${post.content}</p>${post.image ? `<img src="${post.image}" class="rounded-lg max-h-80 w-full object-cover">` : ''}
                                    
                                    <div class="flex justify-between items-center pt-2 border-t text-sm text-gray-500">
                                        <button onclick="toggleLike(${post.id})" class="flex items-center space-x-1 space-x-reverse ${post.likes.includes(user.id)?'text-red-500 font-bold':''}">
                                            <i class="fa-solid fa-heart"></i>
                                            <span>إعجاب (${post.likes.length})</span>
                                        </button>
                                        <button onclick="sharePost(${post.id})" class="flex items-center space-x-1 space-x-reverse hover:text-primary">
                                            <i class="fa-solid fa-share"></i>
                                            <span>مشاركة</span>
                                        </button>
                                    </div>

                                    <div class="border-t pt-2 space-y-2">
                                        <div class="space-y-1">
                                            ${post.comments.map(c => `
                                                <div class="bg-gray-50 p-2 rounded text-sm">
                                                    <span class="font-bold text-primary">${c.userName}:</span> ${c.text}
                                                </div>
                                            `).join('')}
                                        </div>
                                        <form onsubmit="handleAddComment(event, ${post.id})" class="flex gap-2 mt-2">
                                            <input type="text" placeholder="اكتب تعليقاً..." required class="flex-grow px-3 py-1 border rounded-lg text-sm focus:outline-none focus:border-primary">
                                            <button type="submit" class="bg-secondary text-white px-3 py-1 rounded-lg text-sm">تعليق</button>
                                        </form>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        let tempPostImage = '';
        function previewPostImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempPostImage = e.target.result;
                    document.getElementById('postImagePreview').src = tempPostImage;
                    document.getElementById('postImagePreviewContainer').classList.remove('hidden');
                    document.getElementById('imageFileName').innerText = input.files[0].name;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleCreatePost(e) {
            e.preventDefault();
            const user = Store.getCurrentUser();
            const content = document.getElementById('postContent').value;
            if(!content.trim() && !tempPostImage) return;

            const posts = Store.getPosts();
            posts.push({
                id: Date.now(),
                userId: user.id,
                userName: user.name,
                userRole: user.role,
                userAvatar: user.avatar,
                content,
                image: tempPostImage,
                likes: [],
                comments: []
            });
            Store.setPosts(posts);
            tempPostImage = '';
            render();
        }

        function toggleLike(postId) {
            const user = Store.getCurrentUser();
            const posts = Store.getPosts();
            const post = posts.find(p => p.id === postId);
            if (post) {
                const idx = post.likes.indexOf(user.id);
                if (idx > -1) post.likes.splice(idx, 1);
                else post.likes.push(user.id);
                Store.setPosts(posts);
                render();
            }
        }

        function handleAddComment(e, postId) {
            e.preventDefault();
            const user = Store.getCurrentUser();
            const input = e.target.querySelector('input');
            const text = input.value;
            if(!text.trim()) return;

            const posts = Store.getPosts();
            const post = posts.find(p => p.id === postId);
            if(post) {
                post.comments.push({ userId: user.id, userName: user.name, text });
                Store.setPosts(posts);
                render();
            }
        }

        function sharePost(postId) {
            alert('تم توليد رابط المشاركة بنجاح وحفظه في الحافظة.');
        }

        // ================= 2. البحث والصداقات =================
        function renderSearchTab(user) {
            const users = Store.getUsers().filter(u => u.id !== user.id);
            return `
                <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow border space-y-6">
                    <h2 class="text-xl font-bold text-primary">البحث عن محامين وقضاة</h2>
                    <input type="text" id="searchInput" oninput="filterUsers(this.value)" placeholder="ابحث بالاسم أو الصفة القانونية..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary">
                    <div id="searchResults" class="space-y-4">
                        ${users.map(u => renderUserCard(user, u)).join('')}
                    </div>
                </div>
            `;
        }

        function filterUsers(query) {
            const user = Store.getCurrentUser();
            const users = Store.getUsers().filter(u => u.id !== user.id && (u.name.includes(query) || u.role.includes(query)));
            document.getElementById('searchResults').innerHTML = users.map(u => renderUserCard(user, u)).join('');
        }

        function renderUserCard(currentUser, targetUser) {
            const isFriend = currentUser.friends && currentUser.friends.includes(targetUser.id);
            const requests = Store.getRequests();
            const hasSentRequest = requests.some(r => r.from === currentUser.id && r.to === targetUser.id);

            return `
                <div class="flex items-center justify-between p-3 border rounded-lg hover:bg-gray-50">
                    <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="viewUserProfile(${targetUser.id})">
                        <img src="${targetUser.avatar}" class="w-12 h-12 rounded-full object-cover">
                        <div>
                            <h4 class="font-bold">${targetUser.name}</h4>
                            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded">${targetUser.role}</span>
                        </div>
                    </div>
                    <div>
                        ${isFriend ? '<span class="text-green-600 text-sm font-semibold"><i class="fa-solid fa-check"></i> صديق</span>' : 
                          hasSentRequest ? '<span class="text-gray-400 text-sm">تم إرسال الطلب</span>' :
                          `<button onclick="sendFriendRequest(${targetUser.id})" class="bg-primary text-white px-3 py-1 rounded text-sm hover:bg-blue-900">إضافة صديق</button>`}
                    </div>
                </div>
            `;
        }

        function sendFriendRequest(targetId) {
            const user = Store.getCurrentUser();
            const requests = Store.getRequests();
            requests.push({ id: Date.now(), from: user.id, to: targetId });
            Store.setRequests(requests);
            render();
        }

        // ================= 3. الملف الشخصي =================
        function viewUserProfile(userId) {
            viewingUserId = userId;
            currentTab = 'profile';
            render();
        }

        function renderProfileTab(currentUser, profileUserId) {
            const users = Store.getUsers();
            const profileUser = users.find(u => u.id === profileUserId) || currentUser;
            const isOwner = currentUser.id === profileUser.id;
            const posts = Store.getPosts().filter(p => p.userId === profileUser.id);

            return `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow border text-center relative">
                        ${isOwner ? `
                            <label class="absolute top-4 left-4 bg-primary text-white p-2 rounded-full cursor-pointer hover:bg-blue-900">
                                <i class="fa-solid fa-camera"></i>
                                <input type="file" accept="image/*" class="hidden" onchange="updateAvatar(this)">
                            </label>
                        ` : ''}
                        <img src="${profileUser.avatar}" class="w-28 h-28 rounded-full mx-auto mb-4 object-cover border-4 border-primary">
                        <h2 class="text-2xl font-bold">${profileUser.name}</h2>
                        <span class="inline-block bg-secondary text-white text-sm px-3 py-1 rounded-full my-2">${profileUser.role}</span>
                        <p class="text-gray-600 max-w-lg mx-auto">${profileUser.bio}</p>

                        ${isOwner ? `
                            <div class="mt-4">
                                <button onclick="openEditBio()" class="text-primary text-sm hover:underline"><i class="fa-solid fa-pen"></i> تعديل النبذة التعريفية</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-lg font-bold text-primary">المنشورات والأبحاث القانونية</h3>
                        ${posts.length === 0 ? '<p class="text-center text-gray-400">لا توجد منشورات لهذا المستخدم.</p>' : ''}
                        ${posts.map(post => `
                            <div class="bg-white p-4 rounded-xl shadow border space-y-2">
                                <p class="text-gray-700">${post.content}</p>${post.image ? `<img src="${post.image}" class="rounded-lg max-h-60 w-full object-cover">` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const user = Store.getCurrentUser();
                    user.avatar = e.target.result;
                    Store.setCurrentUser(user);
                    const users = Store.getUsers();
                    const idx = users.findIndex(u => u.id === user.id);
                    if(idx > -1) {
                        users[idx] = user;
                        Store.setUsers(users);
                    }
                    render();
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openEditBio() {
            const user = Store.getCurrentUser();
            const newBio = prompt('أدخل النبذة التعريفية الجديدة:', user.bio);
            if(newBio !== null) {
                user.bio = newBio;
                Store.setCurrentUser(user);
                const users = Store.getUsers();
                const idx = users.findIndex(u => u.id === user.id);
                if(idx > -1) {
                    users[idx] = user;
                    Store.setUsers(users);
                }
                render();
            }
        }

        // ================= 4. كتابة المحاضر والطباعة (PDF) =================
        function renderMinutesTab(user) {
            const minutes = Store.getMinutes().filter(m => m.userId === user.id);
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow border space-y-4">
                        <h2 class="text-xl font-bold text-primary"><i class="fa-solid fa-file-pen"></i> محضر جلسة / تحقيق جديد</h2>
                        <form onsubmit="handleSaveMinute(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">عنوان المحضر / القضية</label>
                                <input type="text" id="minTitle" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">اسم الطرف الأول (المدعي / الشاكي)</label>
                                    <input type="text" id="minParty1" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">اسم الطرف الثاني (المدعى عليه / المتهم)</label>
                                    <input type="text" id="minParty2" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="block text-sm font-medium">نص المحضر والتحقيق</label>
                                    <button type="button" onclick="startVoiceRecognition('minContent')" class="bg-secondary text-white text-xs px-2 py-1 rounded hover:bg-amber-700"><i class="fa-solid fa-microphone"></i> إملاء صوتي</button>
                                </div>
                                <textarea id="minContent" rows="6" required class="w-full p-3 border rounded-lg focus:outline-none focus:border-primary"></textarea>
                            </div>
                            <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-900">حفظ المحضر</button>
                        </form>
                    </div>

                    <div class="bg-white p-6 rounded-xl shadow border space-y-4">
                        <h3 class="text-lg font-bold text-primary">المحاضر المحفوظة</h3>
                        <div class="space-y-3">
                            ${minutes.length === 0 ? '<p class="text-gray-400 text-center">لا توجد محاضر محفوظة.</p>' : ''}
                            ${minutes.map(m => `
                                <div class="p-4 border rounded-lg flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold">${m.title}</h4>
                                        <p class="text-xs text-gray-500">الطرفان: ${m.party1} ضد ${m.party2} \vert{}${m.date}</p>
                                    </div>
                                    <button onclick="printMinute(${m.id})" class="bg-gray-800 text-white px-3 py-1 rounded text-sm hover:bg-black"><i class="fa-solid fa-print"></i> طباعة / PDF</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                <div id="printableArea" class="hidden p-8 bg-white"></div>
            `;
        }

        function startVoiceRecognition(targetId) {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('متصفحك لا يدعم الإملاء الصوتي المباشر.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.start();

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                const textarea = document.getElementById(targetId);
                textarea.value += (textarea.value ? ' ' : '') + speechToText;
            };
            alert('تحدث الآن، جاري الاستماع...');
        }

        function handleSaveMinute(e) {
            e.preventDefault();
            const user = Store.getCurrentUser();
            const title = document.getElementById('minTitle').value;
            const party1 = document.getElementById('minParty1').value;
            const party2 = document.getElementById('minParty2').value;
            const content = document.getElementById('minContent').value;

            const minutes = Store.getMinutes();
            minutes.push({
                id: Date.now(),
                userId: user.id,
                title, party1, party2, content,
                date: new Date().toLocaleDateString('ar-SA')
            });
            Store.setMinutes(minutes);
            render();
            alert('تم حفظ المحضر بنجاح.');
        }

        function printMinute(id) {
            const minutes = Store.getMinutes();
            const m = minutes.find(min => min.id === id);
            if(!m) return;

            const printableArea = document.getElementById('printableArea');
            printableArea.innerHTML = `
                <div dir="rtl" style="font-family: 'Cairo', sans-serif; padding: 20px;">
                    <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
                        <h2>جمهورية العدالة القانونية</h2>
                        <h3>محضر رسمي / جلسة تحقيق</h3>
                        <p>التاريخ: ${m.date}</p>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <strong>عنوان المحضر:</strong> ${m.title}<br>
                        <strong>الطرف الأول:</strong> ${m.party1}<br>
                        <strong>الطرف الثاني:</strong> ${m.party2}
                    </div>
                    <div style="margin-bottom: 40px; line-height: 1.8;">
                        <strong>نص المحضر:</strong><br>
                        <p>${m.content.replace(/\n/g, '<br>')}</p>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 50px;">
                        <div>توقيع الطرف الأول: ........................</div>
                        <div>توقيع الطرف الثاني: ........................</div>
                        <div>مُحرر المحضر: ........................</div>
                    </div>
                </div>
            `;
            window.print();
        }

        // ================= 5. كتابة الدعاوى والدفوع القانونية =================
        function renderLawsuitsTab(user) {
            const lawsuits = Store.getLawsuits().filter(l => l.userId === user.id);
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow border space-y-4">
                        <h2 class="text-xl font-bold text-primary"><i class="fa-solid fa-gavel"></i> صياغة صحيفة دعوى أو مذكرة دفوع جديدة</h2>
                        <form onsubmit="handleSaveLawsuit(event)" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">نوع المستند القانوني</label>
                                    <select id="lawType" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                        <option value="صحيفة دعوى">صحيفة دعوى</option>
                                        <option value="مذكرة دفوع">مذكرة دفوع قانونية</option>
                                        <option value="رد دفاع">رد على دفاع</option>
                                        <option value="استئناف حكم">صحيفة استئناف</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">اسم المحكمة الموجه إليها</label>
                                    <input type="text" id="lawCourt" required placeholder="مثال: المحكمة الابتدائية التجارية" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">المدعي / المستأنف / طالب الدفع</label>
                                    <input type="text" id="lawPlaintiff" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">المدعى عليه / المطعون ضده</label>
                                    <input type="text" id="lawDefendant" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">الوقائع (سرد الأحداث باختصار)</label>
                                <textarea id="lawFacts" rows="3" required placeholder="حيثيات الوقائع..." class="w-full p-3 border rounded-lg focus:outline-none focus:border-primary"></textarea>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="block text-sm font-medium">الأسانيد القانونية والطلبات / الدفوع</label>
                                    <button type="button" onclick="startVoiceRecognition('lawArguments')" class="bg-secondary text-white text-xs px-2 py-1 rounded hover:bg-amber-700"><i class="fa-solid fa-microphone"></i> إملاء صوتي</button>
                                </div>
                                <textarea id="lawArguments" rows="5" required placeholder="المواد القانونية، السندات، والطلبات الختامية..." class="w-full p-3 border rounded-lg focus:outline-none focus:border-primary"></textarea>
                            </div>
                            <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-900">حفظ وصياغة المستند</button>
                        </form>
                    </div>

                    <div class="bg-white p-6 rounded-xl shadow border space-y-4">
                        <h3 class="text-lg font-bold text-primary">المستندات والدعاوى المحفوظة</h3>
                        <div class="space-y-3">
                            ${lawsuits.length === 0 ? '<p class="text-gray-400 text-center">لا توجد دعاوى أو دفوع محفوظة.</p>' : ''}
                            ${lawsuits.map(l => `
                                <div class="p-4 border rounded-lg flex justify-between items-center">
                                    <div>
                                        <span class="inline-block bg-primary text-white text-xs px-2 py-0.5 rounded mb-1">${l.type}</span>
                                        <h4 class="font-bold">${l.court}</h4>
                                        <p class="text-xs text-gray-500">أطراف النزاع: ${l.plaintiff} ضد ${l.defendant} \vert{}${l.date}</p>
                                    </div>
                                    <button onclick="printLawsuit(${l.id})" class="bg-gray-800 text-white px-3 py-1 rounded text-sm hover:bg-black"><i class="fa-solid fa-print"></i> طباعة / PDF</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSaveLawsuit(e) {
            e.preventDefault();
            const user = Store.getCurrentUser();
            const type = document.getElementById('lawType').value;
            const court = document.getElementById('lawCourt').value;
            const plaintiff = document.getElementById('lawPlaintiff').value;
            const defendant = document.getElementById('lawDefendant').value;
            const facts = document.getElementById('lawFacts').value;
            const argumentsText = document.getElementById('lawArguments').value;

            const lawsuits = Store.getLawsuits();
            lawsuits.push({
                id: Date.now(),
                userId: user.id,
                type, court, plaintiff, defendant, facts, argumentsText,
                date: new Date().toLocaleDateString('ar-SA')
            });
            Store.setLawsuits(lawsuits);
            render();
            alert('تم حفظ وصياغة المستند القانوني بنجاح.');
        }

        function printLawsuit(id) {
            const lawsuits = Store.getLawsuits();
            const l = lawsuits.find(law => law.id === id);
            if(!l) return;

            const printableArea = document.getElementById('printableArea');
            printableArea.innerHTML = `
                <div dir="rtl" style="font-family: 'Cairo', sans-serif; padding: 30px; font-size: 15px; color: #000;">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <h2 style="font-size: 18px; font-weight: bold;">إلى / ${l.court} المحترمة</h2>
                        <h3 style="font-size: 16px; margin-top: 5px; text-decoration: underline;">${l.type}</h3>
                    </div>
                    <div style="margin-bottom: 25px; line-height: 1.6;">
                        <strong>المدعي / المُمثَّل:</strong> ${l.plaintiff}<br>
                        <strong>المدعى عليه / المطعون ضده:</strong> ${l.defendant}<br>
                        <strong>التاريخ:</strong> ${l.date}
                    </div>
                    <div style="margin-bottom: 25px; line-height: 1.8;">
                        <strong style="display: block; margin-bottom: 5px; color: #1e3a8a;">أولاً: الوقائع</strong>
                        <p style="text-align: justify; background: #f9f9f9; padding: 10px; border-right: 3px solid #1e3a8a;">${l.facts.replace(/\n/g, '<br>')}</p>
                    </div>
                    <div style="margin-bottom: 40px; line-height: 1.8;">
                        <strong style="display: block; margin-bottom: 5px; color: #1e3a8a;">ثانياً: الأسانيد القانونية والطلبات / الدفوع</strong>
                        <p style="text-align: justify; background: #f9f9f9; padding: 10px; border-right: 3px solid #b45309;">${l.argumentsText.replace(/\n/g, '<br>')}</p>
                    </div>
                    <div style="display: flex; justify-content: flex-end; margin-top: 60px;">
                        <div style="text-align: center;">
                            <strong>وكيل الطرف / المحامي</strong><br><br><br>
                            ........................................
                        </div>
                    </div>
                </div>
            `;
            window.print();
        }

        // ================= 6. المراسلة الفورية =================
        let activeChatUserId = null;
        function renderChatTab(user) {
            const users = Store.getUsers().filter(u => u.id !== user.id);
            const chats = Store.getChats();
            const activeUser = users.find(u => u.id === activeChatUserId) || users[0];

            const conversation = activeUser ? chats.filter(c => (c.from === user.id && c.to === activeUser.id) || (c.from === activeUser.id && c.to === user.id)) : [];

            return `
                <div class="bg-white rounded-xl shadow border grid grid-cols-1 md:grid-cols-3 h-[600px]">
                    <div class="border-l p-4 overflow-y-auto space-y-2">
                        <h3 class="font-bold text-primary mb-3">المحادثات</h3>
                        ${users.map(u => `
                            <div onclick="activeChatUserId=${u.id}; render();" class="flex items-center space-x-3 space-x-reverse p-2 rounded-lg cursor-pointer ${activeUser && activeUser.id===u.id?'bg-blue-50 border-primary border':'hover:bg-gray-50'}">
                                <img src="${u.avatar}" class="w-10 h-10 rounded-full object-cover">
                                <div>
                                    <h4 class="font-bold text-sm">${u.name}</h4>
                                    <span class="text-xs text-gray-400">${u.role}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="md:col-span-2 flex flex-col justify-between p-4">
                        ${activeUser ? `
                            <div class="border-b pb-3 flex items-center space-x-3 space-x-reverse">
                                <img src="${activeUser.avatar}" class="w-10 h-10 rounded-full object-cover">
                                <div>
                                    <h4 class="font-bold">${activeUser.name}</h4>
                                    <span class="text-xs text-gray-400">${activeUser.role}</span>
                                </div>
                            </div>
                            <div class="flex-grow overflow-y-auto p-4 space-y-3">
                                ${conversation.length === 0 ? '<p class="text-center text-gray-400">ابدأ المحادثة الآن...</p>' : ''}
                                ${conversation.map(msg => `
                                    <div class="flex ${msg.from === user.id ? 'justify-end' : 'justify-start'}">
                                        <div class="max-w-xs p-3 rounded-lg text-sm ${msg.from === user.id ? 'bg-primary text-white' : 'bg-gray-100 text-gray-800'}">
                                            ${msg.text}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <form onsubmit="handleSendMessage(event, ${activeUser.id})" class="flex gap-2 pt-3 border-t">
                                <input type="text" id="chatInput" placeholder="اكتب رسالة..." required class="flex-grow px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg"><i class="fa-solid fa-paper-plane"></i></button>
                            </form>
                        ` : '<div class="flex items-center justify-center h-full text-gray-400">اختر محادثة للبدء</div>'}
                    </div>
                </div>
            `;
        }

        function handleSendMessage(e, receiverId) {
            e.preventDefault();
            const user = Store.getCurrentUser();
            const input = document.getElementById('chatInput');
            const text = input.value;
            if(!text.trim()) return;

            const chats = Store.getChats();
            chats.push({
                id: Date.now(),
                from: user.id,
                to: receiverId,
                text
            });
            Store.setChats(chats);
            render();
        }

        function initMainScripts(user) {
            const requests = Store.getRequests().filter(r => r.to === user.id);
            const reqContainer = document.getElementById('friendRequestsList');
            if(reqContainer) {
                if(requests.length === 0) {
                    reqContainer.innerHTML = '<p class="text-xs text-gray-400">لا توجد طلبات صداقة.</p>';
                } else {
                    const users = Store.getUsers();
                    reqContainer.innerHTML = requests.map(req => {
                        const sender = users.find(u => u.id === req.from);
                        return sender ? `
                            <div class="flex items-center justify-between text-sm py-1 border-b">
                                <span>${sender.name}</span>
                                <button onclick="acceptFriend(${req.from}, ${req.id})" class="bg-green-600 text-white px-2 py-0.5 rounded text-xs">قبول</button>
                            </div>
                        ` : '';
                    }).join('');
                }
            }
        }

        function acceptFriend(senderId, requestId) {
            const user = Store.getCurrentUser();
            if(!user.friends) user.friends = [];
            user.friends.push(senderId);
            Store.setCurrentUser(user);

            const users = Store.getUsers();
            const idx = users.findIndex(u => u.id === user.id);
            if(idx > -1) {
                users[idx] = user;
                Store.setUsers(users);
            }

            let requests = Store.getRequests();
            requests = requests.filter(r => r.id !== requestId);
            Store.setRequests(requests);
            render();
        }

        render();
    </script>
</body>
</html>

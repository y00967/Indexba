   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Tajawal",Arial,sans-serif;
    background:#eef1f5;
    color:#172b3a;
    min-height:100vh;
}

button,

textarea,

    font-family:inherit;
}

button{
    cursor:pointer;
}

   COLORS
========================================================= */

:root{
    --primary:#102a43;
    --primary2:#183f5c;
    --gold:#d9b44a;
    --bg:#eef1f5;
    --card:#ffffff;
    --text:#172b3a;
    --muted:#718096;
    --border:#d9e0e7;
    --danger:#b23a3a;
    --success:#26734d;
}

    height:64px;
    background:var(--primary);
    color:#fff;

    padding:0 18px;

    z-index:1000;

}

.logo{
    font-size:23px;
    font-weight:800;

}

.logo span{
    color:var(--gold);

}

.search input{

    outline:none;
    background:#fff;
    color:#222;
    border-radius:25px;
    padding:11px 18px;
}

    display:flex;
    gap:7px;
    align-items:center;
}

    height:40px;
    border:0;

    background:#ffffff16;
    color:white;
    font-size:18px;
}

.top-icon:hover{
    background:#ffffff2b;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
}

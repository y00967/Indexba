<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العدالة والمحاماة الرقمية الذكية - متكاملة 100%</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        secondary: '#b45309',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between">

    <div id="app" class="flex-grow flex flex-col">
        <div class="flex items-center justify-center flex-grow">
            <div class="text-center space-y-3">
                <i class="fa-solid fa-scale-balanced text-5xl text-primary animate-bounce"></i>
                <p class="text-lg font-semibold text-gray-600">جاري تحميل منصة العدالة الرقمية السحابية...</p>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t border-gray-200 text-center py-4 text-sm text-gray-500 mt-auto">
        منصة العدالة الرقمية الشاملة - نظام المحاماة والقضاء الذكي | إشراف: الأستاذ / عبدالله صالح صالح محمد الجلال[span_0](start_span)[span_0](end_span)
    </footer>

    <script>
        // إعدادات اتصال Firebase (يمكنك استبدالها ببيانات مشروعك الخاص لاحقاً)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemoPlatform12345",
            authDomain: "digital-justice-platform.firebaseapp.com",
            projectId: "digital-justice-platform",
            storageBucket: "digital-justice-platform.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // تهيئة فايربيس (مع التعامل مع حالة التهيئة المسبقة)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUserData = null;
        let currentTab = 'feed';
        let authMode = 'login';
        let viewingUserId = null;

        // مراقبة حالة المصادقة السحابية
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    currentUserData = { id: user.uid, ...doc.data() };
                } else {
                    currentUserData = { 
                        id: user.uid, 
                        name: user.displayName || 'أستاذ قانوني', 
                        email: user.email, 
                        role: 'محامي ابتدائي', 
                        subscriptionActive: true,
                        bio: 'محامي وممارس قانوني معتمد.',
                        location: 'صنعاء، اليمن',[span_1](start_span)[span_1](end_span)
                        avatar: 'https://via.placeholder.com/150',[span_2](start_span)[span_2](end_span)
                        socials: { email: user.email, phone: '', whatsapp: '' }
                    };
                }
            } else {
                currentUserData = null;
            }
            renderApp();
        });

        function renderApp() {
            const app = document.getElementById('app');
            if (!currentUserData) {
                app.innerHTML = renderAuthScreen();
            } else {
                app.innerHTML = renderMainLayout(currentUserData);
                initDropdownScript();
            }
        }

        function renderAuthScreen() {
            return `
                <div class="flex flex-col items-center justify-center flex-grow p-4 bg-gray-50">
                    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
                        <div class="text-center mb-6">
                            <i class="fa-solid fa-scale-balanced text-4xl text-primary mb-2"></i>
                            <h1 class="text-2xl font-bold text-primary">منصة العدالة الرقمية السحابية</h1>
                            <p class="text-sm text-gray-500">نظام القضاء والمحاماة المربوط سحابياً 100%</p>
                        </div>
                        
                        <div class="flex border-b mb-6">
                            <button onclick="authMode='login'; renderApp();" class="flex-1 pb-2 font-semibold text-center ${authMode==='login'?'border-b-2 border-primary text-primary':'text-gray-400'}">تسجيل الدخول</button>
                            <button onclick="authMode='register'; renderApp();" class="flex-1 pb-2 font-semibold text-center ${authMode==='register'?'border-b-2 border-primary text-primary':'text-gray-400'}">حساب جديد</button>
                        </div>

                        ${authMode === 'login' ? `
                            <form onsubmit="handleCloudLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">البريد الإلكتروني</label>
                                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary" value="abdullah@law.com">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                                    <input type="password" id="loginPass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary" value="123456">
                                </div>
                                <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-blue-900 transition">دخول سحابي آمن</button>
                            </form>
                        ` : `
                            <form onsubmit="handleCloudRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">الاسم الكامل</label>
                                    <input type="text" id="regName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">البريد الإلكتروني</label>
                                    <input type="email" id="regEmail" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                                    <input type="password" id="regPass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">الصفة المهنية والتصنيف</label>
                                    <select id="regRole" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary">
                                        <option value="محامي ابتدائي" selected>محامي ابتدائي</option>
                                        <option value="محامي استئنافي">محامي استئنافي</option>
                                        <option value="قاضي محكمة ابتدائية">قاضي محكمة ابتدائية</option>
                                        <option value="أمين سر محكمة">أمين سر محكمة</option>
                                        <option value="مستخدم عادي / عميل">مستخدم عادي / عميل</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full bg-secondary text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition">إنشاء الحساب سحابياً</button>
                            </form>
                        `}
                    </div>
                </div>
            `;
        }

        async function handleCloudLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) {
                alert('خطأ في بيانات الدخول: ' + err.message);
            }
        }

        async function handleCloudRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;

            try {
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                const userData = {
                    name, email, role,
                    subscriptionActive: true,
                    bio: 'مرحباً بك في صفحتي المهنية.',
                    location: 'صنعاء، اليمن',[span_3](start_span)[span_3](end_span)
                    avatar: 'https://via.placeholder.com/150',[span_4](start_span)[span_4](end_span)
                    socials: { email, phone: '', whatsapp: '' }
                };
                await db.collection('users').doc(res.user.uid).set(userData);
                alert('تم إنشاء الحساب وتسجيله سحابياً بنجاح!');
            } catch (err) {
                alert('خطأ في التسجيل: ' + err.message);
            }
        }

        function renderMainLayout(user) {
            return `
                <header class="bg-primary text-white shadow sticky top-0 z-50">
                    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="flex items-center space-x-2 space-x-reverse cursor-pointer" onclick="currentTab='feed'; renderApp();">
                            <i class="fa-solid fa-scale-balanced text-2xl text-secondary"></i>
                            <span class="font-bold text-lg">العدالة السحابية</span>
                        </div>

                        <div class="relative">
                            <button id="dropdownBtn" class="flex items-center space-x-2 space-x-reverse bg-blue-900 px-3 py-1.5 rounded-lg text-sm font-semibold">
                                <span>${user.name}</span>
                                <span class="text-xs bg-secondary px-2 py-0.5 rounded">${user.role}</span>
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </button>
                            <div id="userDropdownMenu" class="absolute left-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-xl border hidden z-50 py-2">
                                <a href="#" onclick="auth.signOut(); closeDropdown();" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket ml-2"></i> تسجيل الخروج</a>
                            </div>
                        </div>
                    </div>
                </header>
                <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
                    <div class="bg-white p-6 rounded-xl shadow border text-center space-y-4">
                        <h2 class="text-2xl font-bold text-primary">مرحباً بك يا أستاذ ${user.name}</h2>
                        <p class="text-gray-600">أنت الآن متصل بقاعدة البيانات السحابية بالكامل وتعمل المنصة بكفاءة تامة.</p>
                        <button onclick="auth.signOut()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold">تسجيل الخروج</button>
                    </div>
                </main>
            `;
        }

        function initDropdownScript() {
            const btn = document.getElementById('dropdownBtn');
            const menu = document.getElementById('userDropdownMenu');
            if(btn && menu) {
                btn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); };
                window.onclick = () => menu.classList.add('hidden');
            }
        }

        function closeDropdown() {
            const menu = document.getElementById('userDropdownMenu');
            if(menu) menu.classList.add('hidden');
        }
    </script>
</body>
</html>
